# Colab-optimized Phase 1 config (T4 GPU, ~20-40 min with 5K sample)

model:
  name: "distilbert-base-uncased"
  num_labels: 6
  dropout: 0.1
  max_length: 256
  freeze_embeddings: false
  freeze_encoder_layers: 0
  hidden_size: 256
  use_intermediate_layer: true

training:
  train_file: "data/train.csv"
  validation_file: "data/validation.csv"
  test_file: "data/test.csv"
  use_sample: true

  batch_size: 32
  learning_rate: 3.0e-5
  num_epochs: 2
  warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0

  optimizer: "adamw"
  scheduler: "linear"

  use_class_weights: true
  focal_loss: false
  focal_alpha: 0.25
  focal_gamma: 2.0

  use_augmentation: false

  device: "cuda"
  mixed_precision: true
  num_workers: 2
  pin_memory: true

  save_dir: "models"
  save_strategy: "best"
  save_total_limit: 2
  load_best_at_end: true

  eval_strategy: "epoch"
  eval_steps: 500
  logging_steps: 50

  early_stopping: true
  early_stopping_patience: 2
  early_stopping_metric: "eval_loss"

labels:
  names: ["toxic", "severe_toxic", "obscene", "threat", "insult", "identity_hate"]
  text_column: "comment_text"

metrics:
  track: ["accuracy", "precision", "recall", "f1", "auc_roc"]
  threshold: 0.5

tracking:
  use_wandb: false
  project_name: "content-moderation-phase1"
  experiment_name: "colab-distilbert"
  log_model: false

seed: 42

calibration:
  method: "temperature_scaling"
  validation_split: 0.2
  n_bins: 10

thresholds:
  optimization_metric: "f1"
  search_method: "grid"
  search_range: [0.1, 0.9]
  search_steps: 30
  tiers:
    auto_remove:
      target_precision: 0.95
    human_review:
      target_recall: 0.85
    auto_approve:
      target_precision: 0.98
